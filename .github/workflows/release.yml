name: Build and publish Windows bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test bridge
        run: dotnet test database_bridge_lab/tests/Almutamakkin.DatabaseBridge.Tests/Almutamakkin.DatabaseBridge.Tests.csproj -c Release

      - name: Set build version
        id: version
        shell: pwsh
        run: |
          $version = "1.1.$env:GITHUB_RUN_NUMBER"
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish Windows application
        run: >
          dotnet publish database_bridge_lab/src/Almutamakkin.DatabaseBridge.App/Almutamakkin.DatabaseBridge.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -p:AssemblyVersion=${{ steps.version.outputs.value }}.0
          -p:FileVersion=${{ steps.version.outputs.value }}.0
          -p:InformationalVersion=${{ steps.version.outputs.value }}
          -o database_bridge_lab/publish/win-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "/DMyAppVersion=${{ steps.version.outputs.value }}"
          database_bridge_lab/installer/DatabaseBridgeLab.iss

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: جسر المتمكن ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: database_bridge_lab/dist/Almutamakkin-DatabaseBridgeLab-Setup-${{ steps.version.outputs.value }}.exe
